<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Presensi Siswa</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
    }

    header {
      background: #1976d2;
      color: white;
      text-align: center;
      padding: 25px 15px;
    }

    header h1 {
      margin: 0;
      font-size: 30px;
    }

    main {
      max-width: 900px;
      margin: 30px auto;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 25px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.10);
      margin-bottom: 20px;
    }

    video {
      width: 100%;
      max-width: 720px;
      display: block;
      margin: 20px auto;
      border-radius: 12px;
      background: #111;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 12px 20px;
      font-size: 16px;
      cursor: pointer;
      background: #1976d2;
      color: white;
    }

    button:hover {
      background: #125ca1;
    }

    #status {
      margin-top: 15px;
      font-weight: bold;
    }

/* Area kamera dan canvas deteksi wajah */
.camera-container {
  position: relative;
  width: 100%;
  max-width: 720px;
  margin: 20px auto;
}

.camera-container video {
  width: 100%;
  display: block;
  margin: 0;
}

.camera-container canvas {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}
  </style>
</head>

<body>

  <header>
    <h1>Presensi Siswa</h1>
    <p>Sistem Presensi Deteksi Wajah</p>
  </header>

  <main>

    <div class="card">

      <h2>Kamera</h2>

     <div class="camera-container">
  <video id="video" autoplay playsinline></video>
  <canvas id="canvas"></canvas>
</div>

<button onclick="aktifkanKamera()">
  Aktifkan Kamera
</button>

<p id="status">
  Kamera belum diaktifkan.
</p>
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>

<script>

const MODEL_URL =
  const MODEL_URL =
  "https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/model/";

let stream = null;
let deteksiAktif = false;
let modelSiap = false;

let stream = null;
let deteksiAktif = false;
let modelSiap = false;


// ==========================================
// MEMUAT MODEL FACE DETECTION
// ==========================================

async function muatModel() {

  const status = document.getElementById("status");

  try {

    status.textContent =
      "Memuat model deteksi wajah...";

    status.style.color = "orange";

    await faceapi.nets.tinyFaceDetector.loadFromUri(
      MODEL_URL
    );

    modelSiap = true;

    status.textContent =
      "Model deteksi wajah siap.";

    status.style.color = "green";

    console.log("Model TinyFaceDetector berhasil dimuat.");

  } catch (error) {

    console.error(
      "Gagal memuat model:",
      error
    );

    status.textContent =
      "Model deteksi wajah gagal dimuat.";

    status.style.color = "red";

  }
}


// ==========================================
// AKTIFKAN KAMERA
// ==========================================

async function aktifkanKamera() {

  const video =
    document.getElementById("video");

  const status =
    document.getElementById("status");

  try {

    if (!modelSiap) {

      status.textContent =
        "Model deteksi wajah belum siap.";

      status.style.color = "red";

      return;
    }


    status.textContent =
      "Mengaktifkan kamera...";

    status.style.color = "orange";


    // Jika kamera sebelumnya masih aktif
    if (stream) {

      stream.getTracks().forEach(
        track => track.stop()
      );

    }


    stream =
      await navigator.mediaDevices.getUserMedia({

        video: {
          facingMode: "user",
          width: {
            ideal: 1280
          },
          height: {
            ideal: 720
          }
        },

        audio: false

      });


    video.srcObject = stream;


    await video.play();


    status.textContent =
      "Kamera aktif. Mendeteksi wajah...";

    status.style.color = "green";


    deteksiAktif = true;


    mulaiDeteksiWajah();


  } catch (error) {

    console.error(
      "Kesalahan kamera:",
      error
    );

    status.textContent =
      "Kamera/deteksi wajah gagal: " +
      error.message;

    status.style.color = "red";

  }

}


// ==========================================
// DETEKSI WAJAH
// ==========================================

async function mulaiDeteksiWajah() {

  const video =
    document.getElementById("video");

  const canvas =
    document.getElementById("canvas");

  const status =
    document.getElementById("status");


  if (!video.videoWidth || !video.videoHeight) {

    setTimeout(
      mulaiDeteksiWajah,
      500
    );

    return;

  }


  const displaySize = {

    width:
      video.videoWidth,

    height:
      video.videoHeight

  };


  canvas.width =
    displaySize.width;

  canvas.height =
    displaySize.height;


  faceapi.matchDimensions(
    canvas,
    displaySize
  );


  async function proses() {

    if (!deteksiAktif) {
      return;
    }


    try {

      const hasil =
        await faceapi.detectAllFaces(

          video,

          new faceapi.TinyFaceDetectorOptions({

            inputSize: 320,

            scoreThreshold: 0.5

          })

        );


      const resizedDetections =
        faceapi.resizeResults(

          hasil,

          displaySize

        );


      const ctx =
        canvas.getContext("2d");


      ctx.clearRect(

        0,
        0,
        canvas.width,
        canvas.height

      );


      // Gambar kotak pada wajah
      faceapi.draw.drawDetections(

        canvas,

        resizedDetections

      );


      // ==================================
      // STATUS
      // ==================================

      if (hasil.length === 0) {

        status.textContent =
          "Kamera aktif. Wajah belum terdeteksi.";

        status.style.color =
          "orange";


      } else if (hasil.length === 1) {

        status.textContent =
          "✓ Wajah terdeteksi.";

        status.style.color =
          "green";


      } else {

        status.textContent =
          "⚠ Terdeteksi " +
          hasil.length +
          " wajah. Harap hanya satu orang.";

        status.style.color =
          "red";

      }


    } catch (error) {

      console.error(
        "Kesalahan deteksi:",
        error
      );

    }


    setTimeout(
      proses,
      300
    );

  }


  proses();

}


// ==========================================
// HENTIKAN KAMERA
// ==========================================

function hentikanKamera() {

  deteksiAktif = false;


  if (stream) {

    stream.getTracks().forEach(
      track => track.stop()
    );

    stream = null;

  }


  const video =
    document.getElementById("video");


  video.srcObject = null;


  const canvas =
    document.getElementById("canvas");


  const ctx =
    canvas.getContext("2d");


  ctx.clearRect(

    0,
    0,
    canvas.width,
    canvas.height

  );


  const status =
    document.getElementById("status");


  status.textContent =
    "Kamera dihentikan.";

  status.style.color =
    "red";

}


// ==========================================
// MULAI APLIKASI
// ==========================================

window.addEventListener(
  "DOMContentLoaded",
  () => {

    muatModel();

  }
);

</script>
</body>
</html>
