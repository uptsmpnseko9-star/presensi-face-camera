<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Presensi Siswa</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
    }

    header {
      background: #1976d2;
      color: white;
      text-align: center;
      padding: 25px 15px;
    }

    header h1 {
      margin: 0;
      font-size: 30px;
    }

    main {
      max-width: 900px;
      margin: 30px auto;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 25px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.10);
      margin-bottom: 20px;
    }

    .camera-container {
      position: relative;
      width: 100%;
      max-width: 720px;
      margin: 20px auto;
    }

    .camera-container video {
      width: 100%;
      display: block;
      border-radius: 12px;
      background: #111;
    }

    .camera-container canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin: 8px 0 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 12px 20px;
      font-size: 16px;
      cursor: pointer;
      background: #1976d2;
      color: white;
      margin-right: 8px;
      margin-bottom: 8px;
    }

    button:hover {
      background: #125ca1;
    }

    button:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }

    #status {
      margin-top: 15px;
      font-weight: bold;
    }

    #hasilPengenalan {
      margin-top: 15px;
      padding: 15px;
      border-radius: 8px;
      background: #f1f5f9;
      font-size: 18px;
      font-weight: bold;
    }

    #daftarSiswa {
      margin-top: 10px;
      padding-left: 20px;
    }
  </style>
</head>

<body>

  <header>
    <h1>Presensi Siswa</h1>
    <p>Sistem Presensi Deteksi dan Pengenalan Wajah</p>
  </header>

  <main>

    <div class="card">

      <h2>Kamera</h2>

      <div class="camera-container">
        <video id="video" autoplay playsinline></video>
        <canvas id="canvas"></canvas>
      </div>

      <button id="btnKamera">
        Aktifkan Kamera
      </button>

      <p id="status">
        Memuat sistem...
      </p>

      <div id="hasilPengenalan">
        Pengenalan: belum aktif.
      </div>

    </div>


    <div class="card">

      <h2>Daftarkan Wajah Siswa</h2>

      <p>
        Aktifkan kamera, masukkan nama siswa, lalu klik
        <b>Daftarkan Wajah</b> saat hanya satu wajah terlihat.
      </p>

      <input
        type="text"
        id="namaSiswa"
        placeholder="Masukkan nama siswa"
        autocomplete="off"
      >

      <button id="btnDaftar">
        Daftarkan Wajah
      </button>

      <button id="btnHapusData">
        Hapus Semua Data Wajah
      </button>

      <p id="statusDaftar"></p>

      <h3>Siswa Terdaftar</h3>
      <ul id="daftarSiswa">
        <li>Belum ada data wajah.</li>
      </ul>

    </div>

  </main>


  <!-- FACE API -->
  <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>


  <script>

    const MODEL_URL = "./models";

    const STORAGE_KEY = "dataWajahSiswa";

    let stream = null;
    let deteksiAktif = false;
    let modelSiap = false;
    let faceMatcher = null;


    const video =
      document.getElementById("video");

    const canvas =
      document.getElementById("canvas");

    const status =
      document.getElementById("status");

    const btnKamera =
      document.getElementById("btnKamera");

    const btnDaftar =
      document.getElementById("btnDaftar");

    const btnHapusData =
      document.getElementById("btnHapusData");

    const namaSiswa =
      document.getElementById("namaSiswa");

    const statusDaftar =
      document.getElementById("statusDaftar");

    const hasilPengenalan =
      document.getElementById("hasilPengenalan");

    const daftarSiswa =
      document.getElementById("daftarSiswa");


    // =====================================
    // MEMUAT MODEL
    // =====================================

    async function muatModel() {

      status.textContent =
        "Memuat model pengenalan wajah...";

      status.style.color = "orange";

      try {

        await faceapi.nets.tinyFaceDetector.loadFromUri(
          MODEL_URL
        );

        await faceapi.nets.faceLandmark68TinyNet.loadFromUri(
          MODEL_URL
        );

        await faceapi.nets.faceRecognitionNet.loadFromUri(
          MODEL_URL
        );

        modelSiap = true;

        status.textContent =
          "Model pengenalan wajah siap.";

        status.style.color = "green";

        console.log(
          "SEMUA MODEL BERHASIL DIMUAT"
        );

        muatDataWajah();

      } catch (error) {

        console.error(
          "GAGAL MEMUAT MODEL:",
          error
        );

        modelSiap = false;

        status.textContent =
          "Model gagal dimuat.";

        status.style.color = "red";
      }
    }


    // =====================================
    // DATA WAJAH DARI LOCAL STORAGE
    // =====================================

    function muatDataWajah() {

      try {

        const data =
          JSON.parse(
            localStorage.getItem(STORAGE_KEY) || "[]"
          );

        if (!Array.isArray(data) || data.length === 0) {

          faceMatcher = null;
          tampilkanDaftarSiswa(data);
          return;
        }

        const labeledDescriptors =
          data.map(function(siswa) {

            const descriptor =
              new Float32Array(siswa.descriptor);

            return new faceapi.LabeledFaceDescriptors(
              siswa.nama,
              [descriptor]
            );
          });

        faceMatcher =
          new faceapi.FaceMatcher(
            labeledDescriptors,
            0.60
          );

        tampilkanDaftarSiswa(data);

        console.log(
          "DATA WAJAH DIMUAT:",
          data
        );

      } catch (error) {

        console.error(
          "GAGAL MEMUAT DATA WAJAH:",
          error
        );

        faceMatcher = null;
      }
    }


    function tampilkanDaftarSiswa(data) {

      daftarSiswa.innerHTML = "";

      if (!data || data.length === 0) {

        const li =
          document.createElement("li");

        li.textContent =
          "Belum ada data wajah.";

        daftarSiswa.appendChild(li);

        return;
      }

      data.forEach(function(siswa) {

        const li =
          document.createElement("li");

        li.textContent =
          siswa.nama;

        daftarSiswa.appendChild(li);
      });
    }


    // =====================================
    // AKTIFKAN KAMERA
    // =====================================

    async function aktifkanKamera() {

      if (!modelSiap) {

        status.textContent =
          "Model pengenalan wajah belum siap.";

        status.style.color = "red";

        return;
      }

      try {

        status.textContent =
          "Mengaktifkan kamera...";

        status.style.color = "orange";

        if (stream) {

          stream.getTracks().forEach(
            function(track) {
              track.stop();
            }
          );
        }

        stream =
          await navigator.mediaDevices.getUserMedia({

            video: {
              facingMode: "user",
              width: {
                ideal: 1280
              },
              height: {
                ideal: 720
              }
            },

            audio: false

          });

        video.srcObject = stream;

        await video.play();

        deteksiAktif = true;

        status.textContent =
          "Kamera aktif. Mendeteksi dan mengenali wajah...";

        status.style.color = "green";

        mulaiDeteksiWajah();

      } catch (error) {

        console.error(
          "KESALAHAN KAMERA:",
          error
        );

        status.textContent =
          "Kamera gagal diaktifkan: " +
          error.message;

        status.style.color = "red";
      }
    }


    // =====================================
    // DETEKSI + PENGENALAN WAJAH
    // =====================================

    async function mulaiDeteksiWajah() {

      if (!deteksiAktif) {
        return;
      }

      if (
        video.videoWidth === 0 ||
        video.videoHeight === 0
      ) {

        setTimeout(
          mulaiDeteksiWajah,
          500
        );

        return;
      }

      const displaySize = {

        width:
          video.videoWidth,

        height:
          video.videoHeight

      };

      canvas.width =
        displaySize.width;

      canvas.height =
        displaySize.height;

      faceapi.matchDimensions(
        canvas,
        displaySize
      );


      async function proses() {

        if (!deteksiAktif) {
          return;
        }

        try {

          const hasil =
            await faceapi
              .detectAllFaces(
                video,
                new faceapi.TinyFaceDetectorOptions({
                  inputSize: 320,
                  scoreThreshold: 0.5
                })
              )
              .withFaceLandmarks(true)
              .withFaceDescriptors();


          const resizedDetections =
            faceapi.resizeResults(
              hasil,
              displaySize
            );


          const ctx =
            canvas.getContext("2d");

          ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
          );


          faceapi.draw.drawDetections(
            canvas,
            resizedDetections
          );

          faceapi.draw.drawFaceLandmarks(
            canvas,
            resizedDetections
          );


          if (hasil.length === 0) {

            status.textContent =
              "Kamera aktif. Wajah belum terdeteksi.";

            status.style.color =
              "orange";

            hasilPengenalan.textContent =
              "Pengenalan: belum ada wajah.";

          } else if (hasil.length > 1) {

            status.textContent =
              "⚠ Terdeteksi " +
              hasil.length +
              " wajah. Harap hanya satu orang.";

            status.style.color =
              "red";

            hasilPengenalan.textContent =
              "Pengenalan: hanya satu wajah yang diperbolehkan.";

          } else {

            status.textContent =
              "✓ Wajah terdeteksi.";

            status.style.color =
              "green";


            if (faceMatcher) {

              const hasilMatch =
                faceMatcher.findBestMatch(
                  hasil[0].descriptor
                );

              if (
                hasilMatch.label !== "unknown"
              ) {

                hasilPengenalan.textContent =
                  "Pengenalan: " +
                  hasilMatch.label +
                  " | Jarak: " +
                  hasilMatch.distance.toFixed(3);

              } else {

                hasilPengenalan.textContent =
                  "Pengenalan: wajah belum terdaftar.";

              }

            } else {

              hasilPengenalan.textContent =
                "Pengenalan: belum ada siswa terdaftar.";

            }
          }

        } catch (error) {

          console.error(
            "KESALAHAN DETEKSI/PENGENALAN:",
            error
          );

          hasilPengenalan.textContent =
            "Pengenalan: terjadi kesalahan. Lihat Console.";
        }

        setTimeout(
          proses,
          300
        );
      }


      proses();
    }


    // =====================================
    // DAFTARKAN WAJAH SISWA
    // =====================================

    async function daftarkanWajah() {

      if (!modelSiap) {

        statusDaftar.textContent =
          "Model belum siap.";

        statusDaftar.style.color = "red";

        return;
      }

      if (!stream || !video.srcObject) {

        statusDaftar.textContent =
          "Aktifkan kamera terlebih dahulu.";

        statusDaftar.style.color = "red";

        return;
      }

      const nama =
        namaSiswa.value.trim();

      if (!nama) {

        statusDaftar.textContent =
          "Masukkan nama siswa terlebih dahulu.";

        statusDaftar.style.color = "red";

        namaSiswa.focus();

        return;
      }


      try {

        statusDaftar.textContent =
          "Mengambil data wajah...";

        statusDaftar.style.color = "orange";


        const hasil =
          await faceapi
            .detectAllFaces(
              video,
              new faceapi.TinyFaceDetectorOptions({
                inputSize: 320,
                scoreThreshold: 0.5
              })
            )
            .withFaceLandmarks(true)
            .withFaceDescriptors();


        if (hasil.length === 0) {

          statusDaftar.textContent =
            "Wajah belum terdeteksi. Posisikan wajah di depan kamera.";

          statusDaftar.style.color = "red";

          return;
        }


        if (hasil.length > 1) {

          statusDaftar.textContent =
            "Terdeteksi lebih dari satu wajah. Pastikan hanya satu siswa.";

          statusDaftar.style.color = "red";

          return;
        }


        const descriptor =
          Array.from(
            hasil[0].descriptor
          );


        const data =
          JSON.parse(
            localStorage.getItem(STORAGE_KEY) || "[]"
          );


        const indexLama =
          data.findIndex(function(siswa) {
            return siswa.nama.toLowerCase() === nama.toLowerCase();
          });


        if (indexLama >= 0) {

          data[indexLama].descriptor =
            descriptor;

        } else {

          data.push({
            nama: nama,
            descriptor: descriptor
          });
        }


        localStorage.setItem(
          STORAGE_KEY,
          JSON.stringify(data)
        );


        muatDataWajah();


        statusDaftar.textContent =
          "✓ Wajah " +
          nama +
          " berhasil didaftarkan.";

        statusDaftar.style.color =
          "green";

        namaSiswa.value = "";


        console.log(
          "WAJAH BERHASIL DIDAFTARKAN:",
          nama
        );

      } catch (error) {

        console.error(
          "KESALAHAN PENDAFTARAN:",
          error
        );

        statusDaftar.textContent =
          "Gagal mendaftarkan wajah. Lihat Console.";

        statusDaftar.style.color = "red";
      }
    }


    // =====================================
    // HAPUS SEMUA DATA WAJAH
    // =====================================

    function hapusSemuaData() {

      const yakin =
        confirm(
          "Hapus semua data wajah siswa dari browser ini?"
        );

      if (!yakin) {
        return;
      }

      localStorage.removeItem(
        STORAGE_KEY
      );

      faceMatcher = null;

      tampilkanDaftarSiswa([]);

      hasilPengenalan.textContent =
        "Pengenalan: belum ada siswa terdaftar.";

      statusDaftar.textContent =
        "Semua data wajah telah dihapus.";

      statusDaftar.style.color =
        "green";
    }


    // =====================================
    // EVENT
    // =====================================

    btnKamera.addEventListener(
      "click",
      aktifkanKamera
    );

    btnDaftar.addEventListener(
      "click",
      daftarkanWajah
    );

    btnHapusData.addEventListener(
      "click",
      hapusSemuaData
    );


    // =====================================
    // MULAI APLIKASI
    // =====================================

    window.addEventListener(
      "DOMContentLoaded",
      function() {
        muatModel();
      }
    );

  </script>

</body>
</html>
